name: Publish

on:
  push:
    branches:
      - main
    paths:
      - package.json

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: read

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: ./.github/actions/use-node

      - name: Read version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view "$NAME@$VERSION" version 2> /dev/null || true)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "$PUBLISHED_VERSION" = "$VERSION" ]; then
            echo "PUBLISHED=true" >> "$GITHUB_ENV"
            echo "$NAME@$VERSION is already on npm"
          else
            echo "PUBLISHED=false" >> "$GITHUB_ENV"
            echo "Publishing $NAME@$VERSION"
          fi
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "RELEASED=true" >> "$GITHUB_ENV"
            echo "Release $VERSION already exists"
          else
            echo "RELEASED=false" >> "$GITHUB_ENV"
          fi

      - name: Read release title
        if: env.RELEASED == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export BRANCH="release/$VERSION"
          TITLE=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[] | select(.head.ref == $ENV.BRANCH) | .title')
          if [ -z "$TITLE" ]; then
            echo "::error::No merged release/$VERSION pull request found for this commit. Release through the Release workflow."
            exit 1
          fi
          {
            echo "TITLE<<RELEASE_TITLE_EOF"
            echo "$TITLE"
            echo "RELEASE_TITLE_EOF"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        if: env.PUBLISHED == 'false'
        run: npm ci

      - name: Run tests
        if: env.PUBLISHED == 'false'
        run: npm test

      - name: Build package
        if: env.PUBLISHED == 'false'
        run: npm run build

      - name: Publish package
        if: env.PUBLISHED == 'false'
        run: npm publish --access public --provenance

      - name: Create GitHub release
        if: env.RELEASED == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" --target "$GITHUB_SHA" --title "$TITLE" --generate-notes
