name: Publish

on:
  push:
    branches:
      - main
    paths:
      - package.json

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: ./.github/actions/use-node

      - name: Read version
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view "$NAME@$VERSION" version 2> /dev/null || true)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "$PUBLISHED_VERSION" = "$VERSION" ]; then
            echo "PUBLISHED=true" >> "$GITHUB_ENV"
            echo "$NAME@$VERSION is already on npm"
          else
            echo "PUBLISHED=false" >> "$GITHUB_ENV"
            echo "Publishing $NAME@$VERSION"
          fi

      - name: Install dependencies
        if: env.PUBLISHED == 'false'
        run: npm ci

      - name: Run tests
        if: env.PUBLISHED == 'false'
        run: npm test

      - name: Build package
        if: env.PUBLISHED == 'false'
        run: npm run build

      - name: Publish package
        if: env.PUBLISHED == 'false'
        run: npm publish --access public --provenance

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "Release $VERSION already exists"
          else
            gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
          fi
