name: Release

on:
  workflow_dispatch:
    inputs:
      title:
        description: Release title
        required: true
        type: string
      bump:
        description: Version bump
        required: true
        type: choice
        default: minor
        options:
          - patch
          - minor
          - major

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-pull-request:
    if: github.triggering_actor == 'afern247' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: ./.github/actions/use-node

      - name: Bump version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          npm version "$BUMP" --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Preparing version $VERSION"

      - name: Open release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ inputs.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "release/$VERSION"
          git add package.json package-lock.json
          git commit -m "Release $VERSION"
          git push origin "release/$VERSION"
          gh pr create --base main --head "release/$VERSION" --title "$TITLE" --body "Merging this publishes $VERSION to npm and creates the GitHub release titled with this pull request's title."
